name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Ensure the base branch is available for nx affected comparison
      - name: Fetch develop branch
        run: git fetch origin develop --no-tags

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      - name: Install Playwright
        run: npx playwright install --with-deps

      - run: npx nx affected -t lint test build --base=origin/develop --verbose
      - run: npx nx affected --parallel 1 -t e2e-ci --base=origin/develop --verbose
